name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and generate
        working-directory: apps/web
        env:
          NUXT_APP_BASE_URL: /baaxi.ir/
        run: |
          npm ci
          npx nuxi generate
      - name: Pick static output
        run: |
          if [ -d apps/web/dist/baaxi.ir ]; then
            mv apps/web/dist/baaxi.ir /tmp/site
          else
            mv apps/web/dist /tmp/site
          fi
          mkdir -p site-out
          cp -a /tmp/site/. site-out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
